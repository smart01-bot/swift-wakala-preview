name: Materialize Swift Wakala preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/materialize-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack the transferred source
        shell: bash
        run: |
          set -euo pipefail
          cat .preview-source/part-*.b64 | base64 --decode > /tmp/swift-wakala-preview.tar.xz
          echo "e9967b121edaee30a750091db1e510d6501cfb3f18b32786eb960aff2d2b8e9b  /tmp/swift-wakala-preview.tar.xz" | sha256sum --check
          mkdir -p /tmp/swift-wakala-preview-unpacked
          tar -xJf /tmp/swift-wakala-preview.tar.xz -C /tmp/swift-wakala-preview-unpacked
          test -f /tmp/swift-wakala-preview-unpacked/swift-wakala-preview/app.js
          test -f /tmp/swift-wakala-preview-unpacked/swift-wakala-preview/model.js
          cp -a /tmp/swift-wakala-preview-unpacked/swift-wakala-preview/. .
          rm -rf .preview-source
          node --test tests/workflows.test.cjs
      - name: Commit actual website source into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested standalone Swift Wakala preview source'
            git push origin HEAD:main
          fi
